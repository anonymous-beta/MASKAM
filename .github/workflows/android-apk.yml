
name: Build MASKAM Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maskam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # 1. Get the repository source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install a supported Java version.
      # Gradle caching is configured later, after the Android project exists.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Node.js for Vite and Capacitor.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Check the required source files.
      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            package.json \
            index.html \
            app.js \
            styles.css \
            capacitor.config.json
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi
          done

          echo "Required project files found."
          node --version
          npm --version
          java -version

      # 5. Install project dependencies.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No package-lock.json found. Installing from package.json."
            npm install --no-audit --no-fund
          fi

      # 6. Confirm the Capacitor packages are installed.
      - name: Verify Capacitor installation
        shell: bash
        run: |
          set -euo pipefail

          npm ls @capacitor/core @capacitor/cli @capacitor/android

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(
            readFileSync('capacitor.config.json', 'utf8')
          );

          if (!config.appId || !config.appName || !config.webDir) {
            throw new Error(
              'capacitor.config.json must define appId, appName and webDir.'
            );
          }

          if (config.webDir !== 'dist') {
            throw new Error(
              `Expected webDir to be "dist", got "${config.webDir}".`
            );
          }

          console.log('Capacitor configuration is valid.');
          NODE

      # 7. Build the web application.
      - name: Build web application
        run: npm run build

      # 8. Validate the Vite output without assuming filenames.
      # Vite may generate hashed JS and CSS filenames.
      - name: Verify web build output
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s dist/index.html ]]; then
            echo "::error::dist/index.html was not generated."
            exit 1
          fi

          echo "Generated files:"
          find dist -maxdepth 4 -type f -print

          node --input-type=module <<'NODE'
          import {
            readFileSync,
            existsSync,
            statSync
          } from 'node:fs';
          import path from 'node:path';

          const html = readFileSync('dist/index.html', 'utf8');

          const references = [
            ...html.matchAll(
              /<(?:script|link)\b[^>]*?\b(?:src|href)=["']([^"']+)["'][^>]*>/gi
            )
          ];

          for (const match of references) {
            const url = match[1];

            if (
              /^(?:https?:)?\/\//i.test(url) ||
              /^(?:data:|mailto:|#)/i.test(url)
            ) {
              continue;
            }

            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const target = path.resolve('dist', `.${pathname.startsWith('/') ? pathname : `/${pathname}`}`);

            if (!target.startsWith(path.resolve('dist') + path.sep)) {
              throw new Error(`Asset reference escapes dist: ${url}`);
            }

            if (!existsSync(target) || !statSync(target).isFile()) {
              throw new Error(`Referenced build asset is missing: ${url}`);
            }
          }

          if (!/<script\b[^>]*\bsrc=/i.test(html)) {
            throw new Error('No external JavaScript entry point found in dist/index.html.');
          }

          console.log(`Verified ${references.length} local asset references.`);
          NODE

      # 9. Generate the native Android project when it is not committed.
      # If android/ already exists, preserve it and sync it instead.
      - name: Generate Android project if needed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d android ]]; then
            echo "Existing android/ project found; keeping it."
          else
            npx cap add android
          fi

      # 10. Add the camera permission to the Android manifest.
      - name: Configure Android camera permission
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.is_file():
              raise SystemExit(
                  "AndroidManifest.xml is missing. "
                  "Check Capacitor Android project generation."
              )

          content = manifest.read_text(encoding="utf-8")
          permission = (
              '<uses-permission android:name="android.permission.CAMERA" />'
          )

          if not re.search(
              r'<uses-permission\b[^>]*android:name=["\']android\.permission\.CAMERA["\']',
              content
          ):
              updated, count = re.subn(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Could not find the opening manifest element."
                  )

              content = updated
              manifest.write_text(content, encoding="utf-8")

          if "android.permission.CAMERA" not in content:
              raise SystemExit("Failed to configure camera permission.")

          print("Android camera permission is present.")
          PY

      # 11. Copy the built web app and synchronize native plugins.
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 12. Check the generated native project before Gradle starts.
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/src/main/AndroidManifest.xml
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing Android build file: $file"
              exit 1
            fi
          done

          grep -q 'android.permission.CAMERA' \
            android/app/src/main/AndroidManifest.xml

          chmod +x android/gradlew

          echo "Android project validation passed."

      # 13. Configure Gradle caching only after the wrapper exists.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 14. Compile the debug APK.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 15. Confirm that the expected APK actually exists.
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            find android/app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"
          sha256sum "$APK"

      # 16. Make the APK available for download from the Actions run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASKAM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
