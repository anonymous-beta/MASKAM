
name: Build MASKAM Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maskam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify project files
        run: |
          test -s package.json
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s capacitor.config.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Verify web output
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.exists():
              raise SystemExit("AndroidManifest.xml was not generated.")

          text = path.read_text()
          permission = (
              '<uses-permission android:name="android.permission.CAMERA" />'
          )

          if "android.permission.CAMERA" not in text:
              text = re.sub(
                  r"(<manifest\b[^>]*>)",
                  r"\1\n    " + permission,
                  text,
                  count=1
              )

          if "android.permission.CAMERA" not in text:
              raise SystemExit("Failed to add CAMERA permission.")

          path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android manifest
        run: |
          grep -q 'android.permission.CAMERA' \
            android/app/src/main/AndroidManifest.xml

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASKAM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
