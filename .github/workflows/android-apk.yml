
name: MASKAM CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and Build MASKAM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project configuration
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "npm_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_project=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json found; skipping npm build."
          fi

      - name: Install dependencies
        if: steps.project.outputs.npm_project == 'true'
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Run tests
        if: steps.project.outputs.npm_project == 'true'
        run: npm test --if-present

      - name: Build project
        if: steps.project.outputs.npm_project == 'true'
        run: npm run build --if-present
