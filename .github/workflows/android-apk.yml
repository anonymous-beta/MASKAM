
name: Build MASKAM Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MASKAM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android camera permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not generated by Capacitor."
              )

          manifest = path.read_text()

          permission = (
              '<uses-permission android:name="android.permission.CAMERA" />'
          )

          if permission not in manifest:
              marker = "<application"
              if marker not in manifest:
                  raise SystemExit(
                      "Could not find application tag in AndroidManifest.xml."
                  )

              manifest = manifest.replace(
                  marker,
                  permission + "\n    " + marker,
                  1
              )

          path.write_text(manifest)
          print("Camera permission added to Android manifest.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android camera permission
        run: |
          grep -q 'android.permission.CAMERA' \
            android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "::error::APK was not generated."
            exit 1
          }
          ls -lh "$APK"

      - name: Upload MASKAM APK
        uses: actions/upload-artifact@v4
        with:
          name: MASKAM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
